plugins {
    id "com.android.application"
    id "com.chaquo.python"
}
android {
    namespace "com.atlas.mobile"
    compileSdk 35
    defaultConfig {
        applicationId "com.atlas.mobile"
        minSdk 24
        targetSdk 28
        ndk { abiFilters "arm64-v8a", "armeabi-v7a" }
        versionCode 1
        versionName "1.0"
    }
}
chaquopy {
    defaultConfig {
        version = "3.11"
        pip {
            // Avoid optional CCXT async dependencies which require native C builds
            // unavailable in this Android build. Install required runtime deps explicitly.
            options("--no-deps")
            install "ccxt==4.4.98"
            install "certifi>=2024.0.0"
            install "cryptography>=42.0.0"
            install "requests>=2.31.0"
            install "typing_extensions>=4.4.0"
            install "pandas>=2.0.0"
            install "numpy>=1.24.0"
            install "python-dotenv>=1.0.0"
            install "python-dateutil>=2.8.2"
            install "pytz>=2023.3"
            install "tzdata>=2023.3"
            install "six>=1.16.0"
            install "urllib3>=1.26.0"
            install "idna>=3.4"
            install "charset-normalizer>=3.2.0"
        }
    }
}
tasks.register("bundleAtlasPython", Copy) {
    from("..") {
        include "**/*.py"
        exclude "app/**", "tests/**", ".git/**", ".venv/**", "**/__pycache__/**"
    }
    into("src/main/python")
}
tasks.register("generateAtlasMobileAssets") {
    dependsOn("bundleAtlasPython")
    def output = file("src/main/python/mobile_assets.py")
    inputs.files(fileTree("../mobile"))
    outputs.file(output)
    doLast {
        def assets = [:]
        ["index.html", "manifest.webmanifest", "sw.js"].each { assetName ->
            def source = file("../mobile/${assetName}")
            if (!source.exists()) throw new GradleException("Missing mobile asset: ${source}")
            assets[assetName] = java.util.Base64.encoder.encodeToString(source.bytes)
        }
        output.parentFile.mkdirs()
        output.text = "import base64\\nASSETS = {\\n" +
            assets.collect { assetName, encoded -> "    ${assetName.inspect()}: base64.b64decode(${encoded.inspect()}),\\n" }.join("") +
            "}\\n"
    }
}
tasks.named("preBuild").configure { dependsOn("generateAtlasMobileAssets") }
