name: Historical Atlas backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Evaluation window in days"
        required: true
        default: "60"
        type: choice
        options:
          - "30"
          - "60"
          - "90"
      symbols:
        description: "Comma-separated Bybit USDT perpetual symbols"
        required: true
        default: "BTC/USDT:USDT,ETH/USDT:USDT,SOL/USDT:USDT"
        type: string
      mode:
        description: "Strict decision gate or raw signal diagnostic"
        required: true
        default: "strict"
        type: choice
        options:
          - strict
          - lenient
          - both

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run historical backtest
        env:
          ATLAS_AUTO_TRADING_ENABLED: "0"
          ATLAS_TELEGRAM_ENABLED: "0"
          ATLAS_STATE_ENGINE_ENABLED: "0"
          ATLAS_INCREMENTAL_ANALYSIS_ENABLED: "0"
          ATLAS_CORRELATION_ENGINE_ENABLED: "0"
          ATLAS_ECONOMIC_NEWS_FILTER_ENABLED: "0"
          ATLAS_LEARNING_ENGINE_ENABLED: "0"
          ATLAS_SIGNAL_TRACKING_ENABLED: "0"
        shell: bash
        run: |
          set -o pipefail
          args=(--symbols "${{ inputs.symbols }}" --days "${{ inputs.days }}")
          if [ "${{ inputs.mode }}" = "both" ]; then
            echo "===== STRICT MODE =====" | tee historical-backtest.txt
            python backtest.py "${args[@]}" 2>&1 | tee -a historical-backtest.txt
            echo "===== LENIENT RAW-SIGNAL MODE =====" | tee -a historical-backtest.txt
            python backtest.py "${args[@]}" --lenient 2>&1 | tee -a historical-backtest.txt
          else
            if [ "${{ inputs.mode }}" = "lenient" ]; then
              args+=(--lenient)
            fi
            python backtest.py "${args[@]}" 2>&1 | tee historical-backtest.txt
          fi
      - name: Upload backtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-historical-backtest-${{ github.run_number }}
          path: historical-backtest.txt
          if-no-files-found: warn
          retention-days: 30
